<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatted Text</title>

    <style>
        .box {
            border: 5px double red;
            padding: 25px;
            width: 500px;
            margin: 80px auto;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            color: darkred;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
        }

        .highlight {
            background-color: rgb(255, 72, 0);
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Importance of Education</h1>

        <p>
            Education is one of the most <span class="highlight">powerful tools</span>
            for personal growth and development. It helps us gain
            <b>knowledge</b>, improve our skills, and understand the world.
            A good education builds <i>confidence</i>, encourages creativity,
            and prepares us for a <span class="highlight">better future</span>.
        </p>

    </div>

</body>
</html>
