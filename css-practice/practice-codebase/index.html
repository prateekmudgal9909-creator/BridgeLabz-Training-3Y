<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Bento Layout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bento">

        <div class="column left">
            <div class="box about">
                <h2>About Me</h2>
                <p>Welcome to my personal bento layout.</p>
            </div>
        </div>

        <div class="column middle">
            <div class="box projects">
                <h2>Projects</h2>
                <p>My latest projects and work.</p>
            </div>

            <div class="box skills">
                <h2>Skills</h2>
                <p>HTML • CSS • Java • Python</p>
            </div>
        </div>

        <div class="column right">
            <div class="box education">
                <h2>Education</h2>
                <p>B.Tech Computer Science</p>
            </div>

            <div class="box contact">
                <h2>Contact</h2>
                <p>Let's connect!</p>
            </div>
        </div>

    </div>

</body>
</html>
