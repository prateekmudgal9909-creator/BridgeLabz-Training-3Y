<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="product-card">

        <div class="product-image">

            <span class="discount">20% OFF</span>

            <button class="wishlist">♡</button>

            <img src="task-06 image.jpg" alt="Premium Running Shoes">

        </div>


        <div class="product-details">

            <p class="category">SPORTS SHOES</p>

            <h2>Premium Running Shoes</h2>

            <div class="rating">
                <span class="stars">★★★★★</span>
                <span class="reviews">(120)</span>
            </div>

            <div class="price">
                <span class="current-price">₹1,999</span>
                <span class="old-price">₹2,499</span>
            </div>

            <button class="cart-btn">
                Add to Cart
            </button>

        </div>

    </div>

</body>
</html>
