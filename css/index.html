<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: #080707;
            font-family: Arial, sans-serif;

            /* Center the box */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background-color: #222;
            width: 600px;
            padding: 30px;
            text-align: center;
            border: 2px solid white;
            border-radius: 15px;
        }

        #h1 {
            background-color: white;
            color: black;
            padding: 15px;
            border-radius: 8px;
        }

        #hh1 {
            background-color: rgb(98, 23, 183);
            color: white;
            padding: 15px;
            border-radius: 8px;
        }

        #pp {
            background-color: #b0f1c9;
            color: black;
            font-size: 20px;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1 id="h1">Welcome to My Website</h1>

        <h1 id="hh1">My name is Prateek</h1>

        <p id="pp">
            This is a sample webpage with a black background.
        </p>
    </div>

</body>
</html>
