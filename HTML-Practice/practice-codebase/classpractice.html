<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h2><b><u>GENERAL FORM:</u></b></h2>
    </div>
    <form>
        <label for="name">NAME:</label><br>
        <input id="name" type="text" placeholder="Enter your name" name="name" required><br>
        <label for="email">EMAIL:</label><br>
        <input id="email" type="email" placeholder="Enter your email" name="email"><br>
        <label for="password">PASSWORD:</label><br>
        <input id="password" type="password" placeholder="Enter your password" name="password"><br>
        <label for="phone">PHONE:</label><br>
        <input id="phone" type="number" minlength="10" placeholder="Enter your phone number" name="phone"><br>
        
        <label for="date">DATE:</label><br>
        <input id="date" type="date" name="date"><br><br>
        <label>Gender:</label><br>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="other"> Other
        <br><br>
        <label>Skill:</label>
        <select name="skill">
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="javascript">JavaScript</option>
        </select><br><br>
        <input type="checkbox" name="terms" value="terms"> I accept the terms and conditions.<br><br>
        <input type="file" name="file"><br><br>
        <input type="range" name="range" min="1" max="100"><br><br>
        <input type="reset" value="Reset"><br>
        <br>
        <button type="submit">Submit</button>
    

        <input type="">
    
    </form><br>
